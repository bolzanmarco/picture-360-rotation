<title>Forza</title>

<style>
  /* Layout: una schermata alla volta, a tutto schermo; il colore di fondo è la fase. Transizioni laterali tra schermate. */
  :root {
    --ink: #101010; --paper: #F2EFE6; --mute: #6B6760; --card: #FFFFFF; --line: #101010;
    --warm: #FFD23F; --a: #2B45FF; --b: #B5121B; --rest: #9CF2C2; --done: #101010;
    --bg: var(--paper); --fg: var(--ink);
    --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    padding: 0;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #F2EFE6; --paper: #141412; --mute: #A7A399; --card: #1E1D1A; --line: #F2EFE6; --done: #F2EFE6; color-scheme: dark; } }
  :root[data-theme="dark"] { --ink: #F2EFE6; --paper: #141412; --mute: #A7A399; --card: #1E1D1A; --line: #F2EFE6; --done: #F2EFE6; color-scheme: dark; }
  html { height: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { touch-action: pan-y; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; height: 100%; font-family: var(--font); background: var(--bg); color: var(--fg); transition: background .5s var(--ease), color .5s var(--ease); -webkit-font-smoothing: antialiased; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } * { animation: none !important; transition: none !important; } }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { opacity: .85; }
  button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }

  .stage { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; }
  :root { --ios: cubic-bezier(.32,.72,0,1); --push: .48s; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: 0 calc(var(--sab) + 20px); padding-inline: 20px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--bg); will-change: transform; }
  .screen > *, .sheet .panel > * { flex-shrink: 0; }
  .screen > :first-child:not(.navbar) { margin-top: calc(var(--sat) + 12px); }
  .screen::after { content: ""; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity var(--push) var(--ios); }
  .screen.in-right { animation: pushIn var(--push) var(--ios) both; box-shadow: -8px 0 24px rgba(0,0,0,.18); }
  .screen.in-left { animation: popIn var(--push) var(--ios) both; }
  .screen.in-up { animation: inUp var(--push) var(--ios) both; }
  .screen.out-left { animation: pushBack var(--push) var(--ios) both; pointer-events: none; }
  .screen.out-left::after { opacity: .18; }
  .screen.out-right { animation: popOut var(--push) var(--ios) both; pointer-events: none; box-shadow: -8px 0 24px rgba(0,0,0,.18); }
  .screen.out-down { animation: outDown .38s var(--ios) both; pointer-events: none; }
  .screen.dragging { animation: none !important; transition: none; }
  @keyframes pushIn { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes pushBack { from { transform: none; } to { transform: translateX(-30%); } }
  @keyframes popIn { from { transform: translateX(-30%); } to { transform: none; } }
  @keyframes popOut { from { transform: none; } to { transform: translateX(100%); } }
  @keyframes inUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes outDown { to { transform: translateY(100%); } }
  /* sheet dal basso */
  .sheet { position: absolute; inset: 0; z-index: 5; }
  .sheet .dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); animation: fade .35s var(--ios) both; }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--sat) + 48px); background: var(--paper); color: var(--ink); border-radius: 22px 22px 0 0; padding: 8px 20px calc(24px + var(--sab)); overflow-y: auto; overscroll-behavior: contain; animation: inUp .5s var(--ios) both; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: currentColor; opacity: .3; margin: 0 auto 14px; }
  .sheet.closing .dim { animation: fadeOut .3s var(--ios) both; }
  .sheet.closing .panel { animation: outDown .36s var(--ios) both; }
  .sheet.dragging .panel, .sheet.dragging .dim { animation: none !important; }
  @keyframes fade { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
  /* titolo grande che si compatta scorrendo */
  .navbar { position: sticky; top: 0; z-index: 2; margin: 0 -20px 0; padding: calc(var(--sat) + 6px) 20px 8px; background: var(--bg); transition: background .5s var(--ease); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: calc(var(--sat) + 52px); }
  .navbar .ttl { grid-column: 2; font-weight: 800; font-size: 17px; letter-spacing: -.01em; opacity: 0; transform: translateY(6px); transition: all .25s var(--ios); text-align: center; white-space: nowrap; }
  .navbar .r { justify-self: end; }
  .screen.compact .navbar .ttl { opacity: 1; transform: none; }
  .screen.compact .navbar { border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }

  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .7; margin: 0; }
  h1 { font-size: clamp(38px, 11vw, 58px); line-height: .92; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 0; font-variation-settings: "opsz" 96; text-wrap: balance; }
  h2 { font-size: clamp(26px, 7.5vw, 34px); line-height: .98; font-weight: 800; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
  p { margin: 0; line-height: 1.4; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
  .bottom { padding-bottom: 0; }
  .back { display: inline-flex; align-items: center; gap: 2px; background: none; border: none; padding: 8px 10px 8px 0; font-weight: 600; font-size: 17px; justify-self: start; }
  .back svg { width: 18px; height: 18px; }
  .icon { width: 44px; height: 44px; border-radius: 50%; border: 2px solid currentColor; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  .icon svg { width: 20px; height: 20px; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 18px; }
  .week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; opacity: .75; }
  .week i { width: 100%; height: 8px; border-radius: 4px; border: 2px solid var(--line); }
  .week i.a { background: var(--a); border-color: var(--a); } .week i.b { background: var(--b); border-color: var(--b); } .week i.run { background: var(--warm); border-color: var(--warm); }
  .week .today { opacity: 1; } .week .today span { text-decoration: underline; text-underline-offset: 4px; }

  .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .daycard { text-align: left; border: 2px solid var(--line); border-radius: 18px; padding: 16px; background: transparent; color: var(--ink); display: grid; gap: 10px; position: relative; overflow: hidden; transition: transform .2s var(--ease); }
  .daycard:active { transform: scale(.985); }
  .daycard .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; }
  .daycard.a .bar { background: var(--a); } .daycard.b .bar { background: var(--b); }
  .daycard header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-left: 8px; }
  .daycard header small { font-size: 12px; font-weight: 700; opacity: .7; white-space: nowrap; }
  .daycard h2 { padding-left: 8px; }
  .daycard .sub { padding-left: 8px; font-size: 14px; opacity: .8; }
  .daycard .pill { display: inline-block; margin-left: 8px; padding: 6px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; width: max-content; }

  .list { display: flex; flex-direction: column; margin-top: 18px; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 2px solid currentColor; text-align: left; background: none; border-left: none; border-right: none; border-top: none; color: inherit; }
  .item:first-child { border-top: 2px solid currentColor; }
  .item .n { font-size: 13px; font-weight: 700; opacity: .55; font-variant-numeric: tabular-nums; }
  .item .name { font-weight: 700; font-size: 16px; line-height: 1.15; }
  .item .meta { font-size: 13px; opacity: .8; margin-top: 2px; }
  .item .w { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .item .w small { font-size: 12px; font-weight: 600; margin-left: 2px; }
  .item .up { color: var(--a); }
  .note { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
  .note b { font-weight: 800; }
  .btn { font-weight: 800; border: none; border-radius: 999px; padding: 18px 22px; font-size: 20px; width: 100%; background: var(--ink); color: var(--paper); letter-spacing: -.01em; transition: transform .15s var(--ease); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: inherit; border: 2px solid currentColor; }
  .bottom { margin-top: auto; padding-top: 16px; display: grid; gap: 10px; }

  /* sessione live */
  .segments { display: flex; gap: 2px; height: 6px; }
  .segments i { flex: 1; border-radius: 3px; background: currentColor; opacity: .18; transition: opacity .3s; }
  .segments i.past { opacity: .55; } .segments i.now { opacity: 1; }
  .live-top { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 15px; font-weight: 600; gap: 10px; }
  .live-top .phase { font-weight: 800; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 0; }
  .time { font-size: clamp(90px, 34vw, 160px); line-height: .88; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; font-variation-settings: "opsz" 96; margin: 0 0 0 -4px; }
  .time.last { animation: pulse .5s ease-in-out; }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .single { font-size: clamp(28px, 8.5vw, 42px); line-height: 1; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
  .single small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; margin-top: 8px; line-height: 1.35; }
  .ex { font-size: clamp(32px, 10vw, 50px); line-height: .96; font-weight: 800; letter-spacing: -.03em; text-wrap: balance; }
  .scheme { font-size: 17px; font-weight: 700; margin-top: 6px; }
  .cue { font-size: 15px; line-height: 1.35; margin-top: 8px; opacity: .9; max-width: 40ch; }
  .cue.knee { padding-left: 10px; border-left: 3px solid currentColor; }
  .pips { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 14px; font-weight: 700; }
  .pips i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; transition: background .25s; }
  .pips i.done { background: currentColor; }
  .steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stepper { border: 2px solid currentColor; border-radius: 16px; padding: 8px 8px 10px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; }
  .stepper .k { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .75; margin: 0 0 2px 4px; }
  .stepper .v { text-align: center; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .stepper .v small { font-size: 13px; font-weight: 600; margin-left: 2px; }
  .stepper .v.pop { animation: pop .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 50% { transform: scale(1.14); } }
  .step { font-size: 24px; font-weight: 700; border: none; background: transparent; width: 48px; height: 48px; border-radius: 50%; }
  .step:active { background: currentColor; color: var(--bg); }
  .hint { font-size: 13px; opacity: .75; margin-top: 8px; }
  .next { font-size: 14px; line-height: 1.3; opacity: .85; padding-top: 10px; border-top: 2px solid currentColor; margin-top: 8px; }
  .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-top: 12px; }
  .ctl { font-weight: 800; font-size: 17px; border: 2px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 15px 8px; }
  .ctl.primary { background: currentColor; }
  .ctl.primary span { color: var(--bg); }

  /* storico */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stat { border-top: 2px solid currentColor; padding-top: 8px; }
  .stat .k { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .7; }
  .stat .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 170px; border-bottom: 2px solid currentColor; margin-top: 18px; padding: 0 2px; }
  .bar2 { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
  .bar2 b { display: block; width: 100%; border-radius: 4px 4px 0 0; background: currentColor; opacity: .35; transform-origin: bottom; animation: grow .6s var(--ease) both; }
  .bar2.now b { opacity: 1; }
  .bar2.plan b { background: transparent; border: 2px dashed currentColor; opacity: .5; }
  .bar2 span { font-size: 11px; font-weight: 700; white-space: nowrap; opacity: .75; }
  .bar2.now span { opacity: 1; }
  @keyframes grow { from { transform: scaleY(0); } }
  .log { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; margin-top: 18px; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .log .d { opacity: .7; } .log .up { color: var(--a); font-weight: 700; }

  /* fine */
  .finish h1 { font-size: clamp(44px, 14vw, 80px); }
  .recap { margin-top: 18px; display: grid; gap: 0; }
  .recap div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 10px 0; border-bottom: 2px solid currentColor; font-size: 14px; font-variant-numeric: tabular-nums; align-items: baseline; }
  .recap div:first-child { border-top: 2px solid currentColor; }
  .recap b { font-weight: 700; font-size: 15px; }
  .recap .up { font-weight: 800; }
  .recap .keep { opacity: .65; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .tile { border: 2px solid currentColor; border-radius: 14px; padding: 10px 12px; }
  .tile .k { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .7; }
  .tile .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 12px; font-weight: 600; }

  /* impostazioni */
  .setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 2px solid currentColor; }
  .setrow:first-of-type { border-top: 2px solid currentColor; }
  .setrow .l { font-weight: 700; font-size: 16px; } .setrow .s { font-size: 13px; opacity: .7; margin-top: 2px; }
  .seg { display: inline-flex; border: 2px solid currentColor; border-radius: 999px; overflow: hidden; }
  .seg button { border: none; background: transparent; padding: 8px 12px; font-weight: 700; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + var(--sab)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; transition: all .3s var(--ease); pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .demo { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; border: 2px solid currentColor; opacity: .7; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---------- Programma ----------
  const WARM_A = [
    ["Bike o vogatore", "Ritmo facile, 3 minuti. Serve a scaldare, non a sudare.", 180],

    ["Equilibrio sinistro", "In piedi sulla sinistra, ginocchio appena piegato, 30 s. Poi destra.", 60, true],

  const WARM_B = [
    ["Bike o vogatore", "Ritmo facile, 3 minuti.", 180],
    ["Good morning a corpo libero", "Mani dietro la nuca, anche indietro, schiena lunga. Senti tirare i femorali.", 40, true],

    ["Equilibrio sinistro", "In piedi sulla sinistra, ginocchio morbido, 30 s. Poi destra.", 60, true],
  ];
  const LIFTS_A = [
    { id: "squat", name: "Back squat", sets: 4, lo: 5, hi: 6, inc: 2.5, rest: 150, start: 60, cue: "Bilanciere sulle spalle, piedi poco più larghi delle anche. Scendi almeno al parallelo.", knee: "In alto fermati con le ginocchia leggermente piegate. Peso sul centro del piede.", ramp: "Prima: bilanciere vuoto ×8, poi 50% ×5, poi 75% ×3." },

      $("mainBtn", el).firstElementChild.textContent = live.running ? "Pausa" : "Riprendi";
    } else if (s.ramp) {
      main.innerHTML = `<div class="ex">${s.lift.name}</div><div class="scheme">${s.lift.sets} serie × ${s.lift.lo}–${s.lift.hi} · obiettivo ${fmtW(weightFor(s.lift))} kg</div><div class="cue">${s.cue}</div><div class="cue">Senza timer: quando sei pronto vai avanti.</div>`;
      $("mainBtn", el).firstElementChild.textContent = "Pronto";
    } else {
      const L = s.lift, done = (live.log[L.id] || []).length, lastW = store.weights[L.id], sugg = store.suggest[L.id];
      const hint = !L.inc ? "Segna solo le ripetizioni pulite." : sugg != null && sugg !== lastW ? `Ultima volta ${fmtW(lastW)} kg, tutte al massimo: oggi prova ${fmtW(sugg)}.` : lastW != null ? `Ultima volta: ${fmtW(lastW)} kg.` : "Prima volta: il peso è una stima, correggilo.";
      main.innerHTML = `
        <div class="ex">${L.name}</div>
        <div class="scheme">Serie ${s.set} di ${L.sets} · ${L.lo}–${L.hi} ripetizioni</div>
        <div class="cue">${L.cue}</div>${L.knee ? `<div class="cue knee">${L.knee}</div>` : ""}
        <div class="pips"><span>Fatte</span>${Array.from({ length: L.sets }, (_, i) => `<i class="${i < done ? "done" : ""}"></i>`).join("")}</div>
        <div class="steppers">
          ${L.inc ? `<div class="stepper"><span class="k">Peso</span><button class="step" data-w="-1" aria-label="Meno peso">−</button><div class="v" id="wv">${fmtW(live.curW)}<small>kg</small></div><button class="step" data-w="1" aria-label="Più peso">+</button></div>` : `<div class="stepper"><span class="k">Carico</span><div class="v" style="grid-column:1/-1">corpo</div></div>`}
          <div class="stepper"><span class="k">Ripetizioni</span><button class="step" data-r="-1" aria-label="Meno ripetizioni">−</button><div class="v" id="rv">${live.curR}</div><button class="step" data-r="1" aria-label="Più ripetizioni">+</button></div>
        </div>
        <div class="hint">${hint}</div>`;
      $("mainBtn", el).firstElementChild.textContent = "Serie fatta";
      const pop = id => { const v = $(id, el); v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop"); };
      main.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => { live.curW = Math.max(0, live.curW + (+b.dataset.w) * L.inc); $("wv", el).innerHTML = `${fmtW(live.curW)}<small>kg</small>`; pop("wv"); }));
      main.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { live.curR = Math.max(0, live.curR + (+b.dataset.r)); $("rv", el).textContent = live.curR; pop("rv"); }));
    }
  }
  function startSegment(i) {
    cancelAnimationFrame(live.tick); live.running = false;
    live.idx = Math.max(0, Math.min(i, live.plan.length - 1));
    const s = live.plan[live.idx];
    if (s.dur) { live.remaining = s.dur; live.endAt = Date.now() + s.dur * 1000; live.lastBeep = -1; live.running = true; renderLive(); loop(); }
    else { if (s.set) { const prev = live.log[s.lift.id] || []; live.curW = prev.length ? prev[prev.length - 1].w : weightFor(s.lift); live.curR = prev.length ? prev[prev.length - 1].r : s.lift.hi; } renderLive(); }
  }
  function loop() {
    if (!live || !live.running) return;
    const r = Math.max(0, Math.ceil((live.endAt - Date.now()) / 1000));
    if (r !== live.remaining) {
      live.remaining = r; const t = document.getElementById("time"); if (t) t.textContent = r;
      if (r <= 3 && r > 0 && live.lastBeep !== r) { live.lastBeep = r; beep(660, .12); buzz(60); if (t) { t.classList.remove("last"); void t.offsetWidth; t.classList.add("last"); } }
      if (r === 0) { if (live.idx + 1 >= live.plan.length) return finish(); beep(live.plan[live.idx + 1].type === "rest" ? 440 : 990, .35); buzz([120, 60, 120]); return startSegment(live.idx + 1); }
    }
    live.tick = requestAnimationFrame(loop);
  }
  function pause() { live.running = false; cancelAnimationFrame(live.tick); renderLive(); }
  function resume() { live.running = true; live.endAt = Date.now() + live.remaining * 1000; renderLive(); loop(); }
  function completeSet() {
    const s = live.plan[live.idx], L = s.lift;
    (live.log[L.id] = live.log[L.id] || []).push({ w: L.inc ? live.curW : 0, r: live.curR });
    beep(880, .12); buzz(40);
    if (live.idx + 1 >= live.plan.length) return finish();
    startSegment(live.idx + 1);
  }
  function finish() {
    live.running = false; cancelAnimationFrame(live.tick);
    const D = DAYS[live.day], day = live.day, log = live.log, rows = []; let ups = 0, volume = 0;
    D.lifts.forEach(L => {
      const sets = log[L.id] || []; if (!sets.length) return;
      const w = sets[sets.length - 1].w, allTop = sets.length >= L.sets && sets.every(x => x.r >= L.hi);
      volume += sets.reduce((a, x) => a + x.w * x.r, 0);
      if (L.inc) { store.weights[L.id] = w; if (allTop) { store.suggest[L.id] = w + L.inc; ups++; } else delete store.suggest[L.id]; }
      rows.push({ L, w, sets, allTop });
    });
    const min = Math.max(1, Math.round((Date.now() - live.startedAt) / 60000));
    store.history = [{ day, at: new Date().toISOString(), min, log }, ...store.history].slice(0, 60);
    store.demo = false; save();
    beep(660, .15); beep(880, .15, .18); beep(1100, .4, .36); buzz([200, 100, 200]);
    if (lock) { lock.release(); lock = null; }
    live = null;
    go(el => Finish(el, day, rows, ups, volume, min), "up");
  }
  function Finish(el, day, rows, ups, volume, min) {
    setBg("var(--done)", "var(--paper)");
    el.classList.add("finish");
    const other = day === "A" ? "B" : "A";
    el.innerHTML = `
      <p class="eyebrow" style="margin-top:14px">${DAYS[day].label} · ${min} min</p>
      <h1>Fatto,<br>${DAYS[day].label.toLowerCase()}.</h1>
      <p style="margin-top:12px;font-size:17px;font-weight:700">${ups ? `${ups} ${ups === 1 ? "esercizio sale" : "esercizi salgono"} di peso la prossima volta.` : rows.length ? "Stessi pesi la prossima volta, va bene così." : "Nessuna serie segnata."}</p>
      <div class="recap">${rows.map(({ L, w, sets, allTop }) => `<div><b>${L.name}</b><span>${L.inc ? fmtW(w) + " kg · " : ""}${sets.map(x => x.r).join(" ")}</span><span class="${allTop ? "up" : "keep"}">${allTop ? (L.inc ? `→ ${fmtW(w + L.inc)}` : "✓") : "tiene"}</span></div>`).join("")}</div>
      <div class="tiles"><div class="tile"><div class="k">Volume</div><div class="v">${Math.round(volume).toLocaleString("it-IT")} <small>kg</small></div></div><div class="tile"><div class="k">Sedute ${day}</div><div class="v">${store.history.filter(h => h.day === day).length}</div></div></div>
      <p style="margin-top:16px;font-size:14px;opacity:.85">Prossima: ${day === "A" ? "mercoledì corsa facile, venerdì cartella B" : "lunedì cartella A"}${store.suggest[DAYS[other].lifts[0].id] ? `. ${DAYS[other].lifts[0].name} a ${fmtW(store.suggest[DAYS[other].lifts[0].id])}` : ""}.</p>
      <div class="bottom"><button class="btn" id="home" style="background:var(--paper);color:var(--ink)">Torna all'archivio</button></div>`;
    $("home", el).addEventListener("click", () => go(Home, "down"));
  }

  // ---------- Storico ----------
  function HistoryList(el, close) {
    const groups = [["A", LIFTS_A], ["B", LIFTS_B]];
    el.insertAdjacentHTML("beforeend", `
      <div class="topbar"><h2>Storico esercizi</h2><button class="back" data-close style="padding:8px 0 8px 10px">Chiudi</button></div>`);
    el.insertAdjacentHTML("beforeend", `
      ${groups.map(([d, L]) => `<p class="eyebrow" style="margin-top:22px">${d} · ${DAYS[d].label}</p><div class="list" style="margin-top:8px">${L.map(x => { const w = store.weights[x.id], s = store.suggest[x.id]; return `<button class="item" data-lift="${x.id}"><span class="n">${svgChart()}</span><div><div class="name">${x.name}</div><div class="meta">${store.history.filter(h => h.log[x.id]).length} sedute</div></div><div class="w ${s != null && s !== w ? "up" : ""}">${x.inc ? (w != null ? fmtW(s ?? w) + "<small>kg</small>" : "—") : "corpo"}${s != null && s !== w ? " ↑" : ""}</div></button>`; }).join("")}</div>`).join("")}`);
    el.querySelector("[data-close]").addEventListener("click", close);
    el.querySelectorAll("[data-lift]").forEach(b => b.addEventListener("click", () => { close(); const backFn = () => go(Home, "left"); go(e => History(e, b.dataset.lift, backFn), "right", backFn); }));
  }
  const svgChart = () => `<span style="display:inline-flex;width:20px;height:20px;opacity:.6">${svg("chart")}</span>`;
  function History(el, id, onBack) {
    const L = liftById(id); const day = LIFTS_A.includes(L) ? "A" : "B"; const D = DAYS[day];
    setBg("var(--paper)", "var(--ink)");
    const sessions = store.history.filter(h => h.log[id]).slice(0, 8).reverse();
    const pts = sessions.map(h => ({ at: h.at, w: h.log[id][h.log[id].length - 1].w, reps: h.log[id].map(x => x.r), top: h.log[id].length >= L.sets && h.log[id].every(x => x.r >= L.hi) }));
    const next = store.suggest[id];
    const vals = [...pts.map(p => p.w), next ?? 0].filter(v => v > 0);
    const max = Math.max(...vals, 1), min = Math.min(...vals, max);
    const hgt = v => 30 + Math.round((v - min) / Math.max(1, max - min) * 110);
    const useReps = !L.inc;
    const rmax = Math.max(...pts.map(p => Math.max(...p.reps)), 1);
    el.innerHTML = `
      ${back("Indietro", L.name)}
      <p class="eyebrow" style="margin-top:6px">${day} · ${D.label}</p>
      <h1 style="font-size:clamp(32px,9vw,48px)">${L.name}</h1>
      <p style="margin-top:8px;font-size:15px;opacity:.85">${L.sets} × ${L.lo}–${L.hi}${L.inc ? ` · +${fmtW(L.inc)} kg quando tutte le serie arrivano a ${L.hi}` : " · corpo libero"}</p>
      <div class="stats">
        <div class="stat"><div class="k">${useReps ? "Ultime rip." : "Attuale"}</div><div class="v">${pts.length ? (useReps ? pts[pts.length - 1].reps.join(" ") : fmtW(pts[pts.length - 1].w)) : "—"}</div></div>
        <div class="stat"><div class="k">${useReps ? "Record" : "Massimo"}</div><div class="v">${pts.length ? (useReps ? rmax : fmtW(Math.max(...pts.map(p => p.w)))) : "—"}</div></div>
        <div class="stat"><div class="k">Sedute</div><div class="v">${store.history.filter(h => h.log[id]).length}</div></div>
      </div>
      <p class="eyebrow" style="margin-top:22px">${useReps ? "Ripetizioni per seduta" : "Carico per seduta · kg"}</p>
      <div class="chart">${pts.length ? pts.map((p, i) => useReps ? `<div class="bar2 ${i === pts.length - 1 ? "now" : ""}"><span>${p.reps.reduce((a, b) => a + b, 0)}</span><b style="height:${30 + Math.round(p.reps.reduce((a, b) => a + b, 0) / (rmax * L.sets) * 110)}px;animation-delay:${i * 60}ms"></b><span>${fmtDate(p.at)}</span></div>` : `<div class="bar2 ${i === pts.length - 1 ? "now" : ""}"><span>${fmtW(p.w)}</span><b style="height:${hgt(p.w)}px;animation-delay:${i * 60}ms"></b><span>${fmtDate(p.at)}</span></div>`).join("") + (next && !useReps && next !== pts[pts.length - 1]?.w ? `<div class="bar2 plan"><span>${fmtW(next)}?</span><b style="height:${hgt(next)}px"></b><span>prossima</span></div>` : "") : `<p style="opacity:.6;align-self:center;width:100%;text-align:center">Nessuna seduta ancora.</p>`}</div>
      <p class="eyebrow" style="margin-top:22px">Registro</p>
      <div class="log">${[...pts].reverse().map(p => `<span class="d">${fmtDate(p.at)}</span><span>${L.inc ? fmtW(p.w) + " kg · " : ""}${p.reps.join(" ")}</span><span class="${p.top ? "up" : ""}" style="${p.top ? "" : "opacity:.6"}">${p.top ? "↑ sale" : "tiene"}</span>`).join("")}</div>
      ${L.inc ? `<div class="setrow" style="margin-top:22px;border-top:2px solid currentColor"><div><div class="l">Peso della prossima seduta</div><div class="s">Correggi se la stima non ti torna</div></div><div class="seg"><button data-adj="-1" aria-label="Meno">−</button><button disabled style="font-variant-numeric:tabular-nums" id="adjv">${fmtW(weightFor(L))}</button><button data-adj="1" aria-label="Più">+</button></div></div>` : ""}
      <div style="height:24px"></div>`;
    wireBack(el, onBack);
    el.querySelectorAll("[data-adj]").forEach(b => b.addEventListener("click", () => { const v = Math.max(0, weightFor(L) + (+b.dataset.adj) * L.inc); store.suggest[id] = v; save(); $("adjv", el).textContent = fmtW(v); toast(`${L.name}: prossima a ${fmtW(v)} kg`); }));
  }

  // ---------- Impostazioni ----------
  function Settings(el, close) {
    const s = store.settings;
    const body = document.createElement("div");
    el.appendChild(body);
    const draw = () => { body.innerHTML = `
      <div class="topbar"><h2>Impostazioni</h2><button class="back" data-close style="padding:8px 0 8px 10px">Chiudi</button></div>
      <div style="margin-top:16px">
        <div class="setrow"><div><div class="l">Suoni</div><div class="s">Bip negli ultimi 3 secondi e ai cambi</div></div><div class="seg" id="snd"><button data-v="1" aria-pressed="${s.sound}">On</button><button data-v="0" aria-pressed="${!s.sound}">Off</button></div></div>
        <div class="setrow"><div><div class="l">Recuperi</div><div class="s">Se hai poco tempo, accorciali</div></div><div class="seg" id="rst"><button data-v="0.75" aria-pressed="${s.restScale === .75}">−25%</button><button data-v="1" aria-pressed="${s.restScale === 1}">Normali</button><button data-v="1.25" aria-pressed="${s.restScale === 1.25}">+25%</button></div></div>
        <div class="setrow"><div><div class="l">Storico di esempio</div><div class="s">${store.demo ? "Attivo: le tre settimane che vedi sono finte" : "Non attivo: i dati sono tuoi"}</div></div><button class="ctl" style="padding:10px 14px;font-size:14px" id="demo">${store.demo ? "Azzera" : "Carica"}</button></div>
        <div class="setrow"><div><div class="l">Cancella tutto</div><div class="s">Pesi, storico e impostazioni su questo telefono</div></div><button class="ctl" style="padding:10px 14px;font-size:14px" id="wipe">Cancella</button></div>
      </div>
      <p style="margin-top:22px;font-size:13px;opacity:.7;max-width:40ch">Tutto resta sul telefono. Nessun account, nessun server. Prototipo v2 · ottobre 2026.</p>`;
    body.querySelector("[data-close]").addEventListener("click", close);
    $("snd", body).querySelectorAll("button").forEach(b => b.addEventListener("click", () => { s.sound = b.dataset.v === "1"; save(); draw(); }));
    $("rst", body).querySelectorAll("button").forEach(b => b.addEventListener("click", () => { s.restScale = +b.dataset.v; save(); draw(); }));
    let armed = false;
    $("wipe", body).addEventListener("click", e => { if (!armed) { armed = true; e.target.textContent = "Sicuro? Tocca ancora"; return; } store = { weights: {}, suggest: {}, history: [], settings: { sound: true, restScale: 1 }, demo: false, seeded: true }; save(); toast("Tutto cancellato"); close(); go(Home, "left"); });
    $("demo", body).addEventListener("click", () => { if (store.demo) { store.history = []; store.weights = {}; store.suggest = {}; store.demo = false; save(); toast("Storico azzerato"); } else { seedDemo(); toast("Storico di esempio caricato"); } draw(); });
    };
    draw();
  }

  // ---------- Audio, vibrazione, wake lock ----------
  let ctx;
  function beep(freq, len, when = 0) {
    if (!store.settings.sound) return;
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.value = freq; g.gain.setValueAtTime(.0001, ctx.currentTime + when); g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + when + .01); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + when + len); o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + when); o.stop(ctx.currentTime + when + len + .05); } catch (e) {}
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  let lock = null;
  async function keepAwake() { try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && live) keepAwake(); });
  document.addEventListener("gesturestart", e => e.preventDefault());
  let lastTap = 0; document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 350) e.preventDefault(); lastTap = now; }, { passive: false });
  document.addEventListener("keydown", e => { if (!live) return; if (e.key === " " || e.key === "Enter") { e.preventDefault(); document.getElementById("mainBtn")?.click(); } if (e.key === "ArrowRight") document.getElementById("nextBtn")?.click(); if (e.key === "ArrowLeft") document.getElementById("prevBtn")?.click(); });

  go(Home, "up");
})();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
